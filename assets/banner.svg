<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" />
    <path d="M200 0V300 M400 0V300 M600 0V300 M800 0V300 M1000 0V300" />
  </g>

  <!-- Dynamic / Background Decorative Visual Elements -->
  <!-- Animated / Floating Metrics Nodes -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="40" fill="#38bdf8">
      <animate attributeName="cy" values="80;95;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="55" fill="#c084fc">
      <animate attributeName="cy" values="220;200;220" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="70" r="25" fill="#818cf8">
      <animate attributeName="cx" values="980;1000;980" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data Flow Pipelines Background Graphic -->
  <path d="M 100 240 Q 300 280 500 240 T 900 260 T 1100 220" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M 50 260 Q 350 210 650 270 T 1150 240" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Content Card Background (Ensures title/subtitle contrast) -->
  <rect x="180" y="45" width="840" height="210" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Badge Accent -->
    <rect x="520" y="65" width="160" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="600" y="84" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DATA QUALITY 2026</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Data Quality Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated Ecosystem of SaaS &amp; Open-Source Data Reliability Tools
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(320, 205)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="80" y="17" fill="#e2e8f0">🛡️ Anomaly Detection</text>
      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="270" y="17" fill="#e2e8f0">📊 Observability &amp; Profiling</text>
      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="465" y="17" fill="#e2e8f0">📋 Declarative Contracts</text>
    </g>
  </g>
</svg>
